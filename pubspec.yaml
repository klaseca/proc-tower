name: proc_tower
description: "Desktop app for managing custom background processes"
publish_to: 'none'

version: 0.1.0

environment:
  sdk: ^3.14.0
  flutter: ^3.50.0

dependencies:
  disco: ^2.0.0
  flutter:
    sdk: flutter
  jolt: ^3.2.2
  jolt_setup: ^3.2.3
  material_ui: ^1.11.0
  nanoid2: ^2.0.1
  slang: ^4.16.0
  slang_flutter: ^4.16.0
  tray_manager: ^0.5.2
  trina_grid: ^2.4.0
  window_manager: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - windows/runner/resources/app_icon.ico
    - macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_32.png
