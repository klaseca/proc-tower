name: proc_tower
description: "Desktop app for managing custom background processes"
publish_to: 'none'

version: 0.0.0

environment:
  sdk: ^3.11.5
  flutter: ^3.41.7

dependencies:
  disco: ^2.0.0
  flutter:
    sdk: flutter

  jolt: ^3.2.2
  jolt_setup: ^3.2.3
  nanoid2: ^2.0.1
  tray_manager: ^0.5.2
  trina_grid: ^2.2.1
  window_manager: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - windows/runner/resources/app_icon.ico
    - macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_32.png
