name: proc_tower
description: "Desktop app for managing custom background processes"
publish_to: 'none'

version: 0.1.0

environment:
  sdk: ^3.14.0
  flutter: ^3.50.0

dependencies:
  disco: ^2.0.0
  flutter:
    sdk: flutter
  jolt: ^3.2.2
  jolt_setup: ^3.2.3
  material_ui: ^1.11.0
  mix: ^2.4.0
  nanoid2: ^2.1.0
  path: ^1.9.1
  path_provider: ^2.1.6
  slang: ^4.19.2
  slang_flutter: ^4.19.0
  tray_manager: ^0.9.0
  trina_grid: ^2.4.0
  # Keep the plugin backend until https://github.com/leanflutter/window_manager/issues/596 is fixed.
  window_manager: 0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - windows/runner/resources/app_icon.ico
    - macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_32.png
